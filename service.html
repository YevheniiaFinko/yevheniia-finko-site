          items: ['Один процес, який більше не залежить від ручного контролю засновника', 'Узгоджені правила, відповідальність і дані між командами', 'Одна головна метрика, за якою видно результат', 'AI й автоматизації лише там, де вони зменшують витрати або збільшують ресурс команди', 'Робоча система, передана команді та перевірена через 30 днів'],
          boundariesLabel: 'Що це і чого тут немає', boundariesTitle: 'Один процес. Один результат',
          boundaries: ['Не перебудовуємо весь бізнес за один проєкт', 'Не додаємо черговий шар інструментів без чіткої відповідальності', 'Не автоматизуємо процес, поки не визначені його правила й метрика', 'Будуємо один процес із потенціалом вимірюваного ефекту для бізнесу'],
          transition: 'Оплата двома частинами: проєктування, потім побудова.',
          ctaLabel: 'Почніть тут', ctaTitle: 'Принесіть процес, який коштує найбільше',
          ctaText: 'Принесіть процес, який хочете покращити, або проблему, яку хочете зрозуміти, і ми визначимо, чи підходить вам Money on the Table.'
        }
      }
    };

    const copy = (offers[offer] || offers['money-on-the-table'])[ua ? 'ua' : 'en'];
    const ui = ua
      ? { back: '← Назад до способів почати', sideNote: 'Фіксована вартість, підтверджуємо на короткому дзвінку.', sideCta: '[ Забронювати дзвінок ]', cta: '[ Забронювати 30-хвилинний дзвінок ]', footer: 'Yevheniia Finko · Засновниця та стратегиня AI-операцій' }
      : { back: '← Back to ways to start', sideNote: 'Fixed fee, confirmed on a short call.', sideCta: '[ Book a call ]', cta: '[ Book a 30-minute call ]', footer: 'Yevheniia Finko · Founder & AI Operations Strategist' };

    document.documentElement.lang = ua ? 'uk' : 'en';
    document.title = `Yevheniia Finko | ${copy.title}`;
    const home = ua ? 'code.html?lang=ua' : 'code.html';
    const currentOffer = offers[offer] ? offer : 'money-on-the-table';
    document.getElementById('brand-link').href = home;
    document.getElementById('back-link').href = `${home}#ways-to-work`;
    document.getElementById('back-link').textContent = ui.back;
    document.getElementById('side-note').textContent = ui.sideNote;
    document.getElementById('side-cta').textContent = ui.sideCta;
    document.getElementById('header-cta').textContent = navLabels.cta;
    document.getElementById('cta-link').textContent = ui.cta;
    document.getElementById('footer-line').textContent = ui.footer;
    document.getElementById('role-fit').textContent = copy.roleFit;
    document.getElementById('transition-note').textContent = copy.transition;

    ['en-link', 'mobile-en-link'].forEach(id => { const el = document.getElementById(id); if (el) el.href = `service.html?offer=${currentOffer}`; });
    ['ua-link', 'mobile-ua-link'].forEach(id => { const el = document.getElementById(id); if (el) el.href = `service.html?offer=${currentOffer}&lang=ua`; });
    document.getElementById('en-link').classList.toggle('text-[#111215]', !ua);
    document.getElementById('en-link').classList.toggle('font-semibold', !ua);
    document.getElementById('ua-link').classList.toggle('text-[#111215]', ua);
    document.getElementById('ua-link').classList.toggle('font-semibold', ua);

    // Voice rule: no em dashes in visible copy. Short dashes in ranges (4–7) stay.
    const presentationText = value => String(value).replace(/\s*—\s*/g, ', ');
    ['eyebrow', 'title', 'lead', 'sideLabel', 'sideText', 'fitLabel', 'fitTitle', 'fitText', 'signalsLabel', 'signalsTitle', 'stepsLabel', 'stepsTitle', 'includesLabel', 'includesTitle', 'boundariesLabel', 'boundariesTitle', 'ctaLabel', 'ctaTitle', 'ctaText']
      .forEach(key => document.getElementById(key.replace(/[A-Z]/g, letter => `-${letter.toLowerCase()}`)).textContent = presentationText(copy[key]));

    const addTextRow = (target, item, index) => {
      const row = document.createElement('div');
      row.className = 'py-7 border-b border-[#E7E8EB] flex gap-5';
      const number = document.createElement('span');
      number.className = 'text-xs font-mono text-[#5B6F95] pt-1';
      number.textContent = `0${index + 1}`;
      const text = document.createElement('p');
      text.className = 'text-base sm:text-lg text-[#666666] leading-relaxed';
      text.textContent = presentationText(item);
      row.append(number, text);
      target.append(row);
    };
    copy.signals.forEach((item, index) => addTextRow(document.getElementById('signals'), item, index));
    copy.items.forEach((item, index) => addTextRow(document.getElementById('deliverables'), item, index));
    copy.boundaries.forEach((item, index) => addTextRow(document.getElementById('boundaries'), item, index));
    const steps = document.getElementById('steps');
    copy.steps.forEach((step, index) => {
      const row = document.createElement('div');
      row.className = 'grid grid-cols-[auto_1fr] gap-x-5 py-7 border-b border-[#DDE0E4]';
      const number = document.createElement('span');
      number.className = 'text-xs font-mono text-[#5B6F95] pt-1';
      number.textContent = `0${index + 1}`;
      const content = document.createElement('div');
      const heading = document.createElement('h3');
      heading.className = 'text-lg font-medium tracking-tight mb-2';
      heading.textContent = presentationText(step[0]);
      const body = document.createElement('p');
      body.className = 'text-base text-[#666666] leading-relaxed';
      body.textContent = presentationText(step[1]);
      content.append(heading, body);
      row.append(number, content);
      steps.append(row);
    });
  </script>
</body>
</html>
